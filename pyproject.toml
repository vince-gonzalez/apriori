[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authorecon"
version = "1.0.0"
description = "Reconcile a body of published work against every place it lives - for any ORCID, from public sources - plus the gates that run before research output leaves your hands."
readme = "README-pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Gonzalez", email = "vincegonzalez@me.com" }]
keywords = [
    "research software",
    "submission hygiene",
    "preprint",
    "Zenodo",
    "reproducibility",
    "research metadata",
    "ORCID",
    "OpenAlex",
    "Wikidata",
    "static analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Only abstract-op's PDF source needs this. Every other tool,
# and every other source abstract-op reads, is standard library.
pdf = ["pypdf>=4"]

[project.urls]
Homepage = "https://github.com/vince-gonzalez/apriori"
Source = "https://github.com/vince-gonzalez/apriori"
Issues = "https://github.com/vince-gonzalez/apriori/issues"

[project.scripts]
authorecon-report = "authorecon.report:main"
authorecon-discover = "authorecon.discover:main"
authorecon-qikstgen = "authorecon.qikstgen:main"
authorecon-deposit-lint = "authorecon.deposit_lint:main"
authorecon-orcid-diff = "authorecon.orcid_diff:main"
authorecon-index-lag = "authorecon.index_lag:main"
authorecon-citation-resolve = "authorecon.citation_resolve:main"
authorecon-wd-sweeper = "authorecon.wd_sweeper:main"
authorecon-abstract-op = "authorecon.abstract_op:main"
authorecon-orcid-collision = "authorecon.orcid_collision:main"
authorecon-self-citation = "authorecon.self_citation:main"
authorecon-retraction-watch = "authorecon.retraction_watch:main"
authorecon-venue-reality = "authorecon.venue_reality:main"
authorecon-pdf-conform = "authorecon.pdf_conform:main"
authorecon-dependency-necessity = "authorecon.dependency_necessity:main"
submission-scrub = "authorecon.submission_scrub:main"
slop-scan = "authorecon.slop_scan:main"
software-inventory = "authorecon.software_inventory:main"
zenodo-precheck = "authorecon.zenodo_precheck:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
